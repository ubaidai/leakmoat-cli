name: publish

# Publishes to npm when a GitHub release is created. Uses npm Trusted Publishing (OIDC):
# no npm token is stored anywhere, and provenance is attached automatically so anyone
# can verify the package was built from this repository.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5+. Pinned so a new npm release cannot change this pipeline.
      - run: npm install -g npm@11.21.0
      - run: npm test
      - run: npm publish --access public
